<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/gh/cyberskyline/semantic-ui@master/dist/semantic.min.css' />
    <title>Fan Club</title>
    <style>
      .blink {
        animation: blinker 1s linear infinite;
      }

      @keyframes blinker {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion) {
        .blink {
          animation: none;
        }
      }
    </style>
    
    
  </head>
  <body style='padding: 2em; background: linear-gradient(290deg, #677eaf -10%, #033397 100%)'>
    
<div class="ui very padded segment" style="margin: auto; max-width: 800px;">
  <div class="ui grid two column doubling stackable">
    <div class="column">
      <h1 class="ui header">
        Tom is so cool
      </h1>
      <div class="ui large image">
         <img src="https://live.staticflickr.com/65535/49489752471_59a92f3728_w_d.jpg" />
      </div>
    </div>
    <div class="column">
      <h1 class="ui header">My Tom's Space</h3>
      <div style="margin-bottom: 0.5em;">
        <div class="ui blue image label">
          <span style="margin-left: 0.5em;">Age:</span>
          <div class="detail">30 something</div>
        </div>
      </div>
      <div style="margin-bottom: 0.5em;">
        <div class="ui blue image label">
          <span style="margin-left: 0.5em;">Lives:</span>
          <div class="detail">Washington, DC</div>
        </div>
      </div>
      <div style="margin-bottom: 0.5em;">
        <div class="ui blue image label">
          <span style="margin-left: 0.5em;">Enjoys:</span>
          <div class="detail">PCAPs and traveling</div>
        </div>
      </div>
      <div style="margin-bottom: 0.5em;">
        <div class="ui blue image label">
          <span style="margin-left: 0.5em;">Status:</span>
          <div class="detail">Probably forgetting a password</div>
        </div>
      </div>
      <h2 class="ui blue header blink">Add me as a friend!</h2>
      <h2 class="ui orange header blink">Check out my awesome pics!</h2>
    </div>
  </div><div style="border-style: solid; margin-top: 2em; padding: 1em; text-align: center;">
      <h3 class="ui red header">STOP</h3>
      <p>Only real fans would POST to our secret fan page</p>
    </div>
  
</div>


    <p style='color: rgba(255,255,255,0.5); font-size: 10px; text-align: center; margin-top: 2em;'> Fan Club Challenge | &copy; 2022 Cyber Skyline </p>
  </body>
</html>
